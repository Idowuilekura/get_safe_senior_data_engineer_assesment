version: 2

models:
  - name: premium_transactions
    tests:
      - accepted_rejected_row_counts_match:
          arguments:
            base_model: ref('stg_premium__transactions')
            rejected_model: ref('premium_rejected_transactions')
      - no_overlap_with:
          arguments:
            compare_model: ref('premium_rejected_transactions')
            key_column: transaction_partner_sk
    columns:
      - name: transaction_partner_sk
        tests:
          - not_null
          - unique
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: charged_partner
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null

  - name: premium_rejected_transactions
    columns:
      - name: transaction_partner_sk
        tests:
          - not_null
      - name: transaction_id_occurrences
        tests:
          - not_null
      - name: transaction_partner_sk_occurrences
        tests:
          - not_null
      - name: is_rejected
        tests:
          - not_null
      - name: rejection_reason
        tests:
          - not_null
