version: 2

models:
  - name: silver_transaction
    tests:
      - accepted_rejected_row_counts_match:
          arguments:
            base_model: ref('bronze_transaction')
            rejected_model: ref('silver_transaction_rejected')
      - no_overlap_with:
          arguments:
            compare_model: ref('silver_transaction_rejected')
            key_column: transaction_partner_sk
    columns:
      - name: transaction_partner_sk
        tests:
          - not_null
          - unique
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: charged_partner
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null

  - name: silver_transaction_rejected
    columns:
      - name: transaction_partner_sk
        tests:
          - not_null
      - name: transaction_id_occurrences
        tests:
          - not_null
      - name: transaction_partner_sk_occurrences
        tests:
          - not_null
      - name: is_rejected
        tests:
          - not_null
      - name: rejection_reason
        tests:
          - not_null
