[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premium-pipeline"
version = "0.1.0"
description = "Bronze to silver pipeline with metadata-driven recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "adbc-driver-postgresql>=1.0.0",
  "polars>=1.0.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=15.0.0",
  "sqlalchemy>=2.0.0",
]

[project.scripts]
premium-pipeline = "pipeline.main:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
