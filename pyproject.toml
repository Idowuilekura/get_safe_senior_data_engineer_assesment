[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premium-pipeline"
version = "0.1.0"
description = "Bronze to silver pipeline with metadata-driven recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "adbc-driver-postgresql>=1.0.0",
  "polars>=1.0.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=15.0.0",
  "sqlalchemy>=2.0.0",
]

[project.scripts]
premium-pipeline = "pipeline.main:main"

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
