name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "src/**"
      - "tests/**"
      - "infra/**"
      - "airflow_stuff/**"
      - "analytics_premium/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync environment
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: premium-pipeline-distribution
          path: dist/*

  publish-docker-images:
    runs-on: ubuntu-latest
    needs: build
    environment: DOCKERHUB_TOKEN
    env:
      DOCKERHUB_USERNAME: idowuilekura
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image version tag
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Airflow image
        uses: docker/build-push-action@v6
        with:
          context: airflow_stuff
          file: airflow_stuff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/premium-pipeline-airflow:${{ steps.vars.outputs.version }}
            ${{ (github.ref_type == 'tag' || github.ref_name == 'master') && format('{0}/premium-pipeline-airflow:latest', env.DOCKERHUB_USERNAME) || '' }}

      - name: Build and push ETL image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/premium-pipeline:${{ steps.vars.outputs.version }}
            ${{ (github.ref_type == 'tag' || github.ref_name == 'master') && format('{0}/premium-pipeline:latest', env.DOCKERHUB_USERNAME) || '' }}

      - name: Build and push dbt image
        uses: docker/build-push-action@v6
        with:
          context: analytics_premium
          file: analytics_premium/infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/analytics-premium-dbt:${{ steps.vars.outputs.version }}
            ${{ (github.ref_type == 'tag' || github.ref_name == 'master') && format('{0}/analytics-premium-dbt:latest', env.DOCKERHUB_USERNAME) || '' }}
